[project]
name = "agentshelf"
version = "0.1.0"
description = "Agent-readiness copilot for small PayPal merchants (PayPal AI Hackathon 2026)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.161.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RET", "PT", "PTH", "ARG", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Asserts are how pytest checks things; fake credentials in tests are not secrets.
"tests/**" = ["S101", "S105", "S106"]
# Route stubs declare their contract parameters before the logic that uses them exists.
"app/api/**" = ["ARG001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = ["live: calls real sandbox services; skipped unless LIVE_TESTS=1"]
filterwarnings = [
    "error",
    # Starlette 1.9's TestClient prefers httpx2; staying on httpx until that package is vetted.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
branch = true
